name: JKT48 Website

on:
  push:
    branches: [main]
    paths:
      - "website/jkt48/**"
      - "src/utils/embeds.js"
      - "test/jkt48-website.test.js"
      - ".github/workflows/jkt48-pages.yml"
  pull_request:
    paths:
      - "website/jkt48/**"
      - "src/utils/embeds.js"
      - "test/jkt48-website.test.js"
      - ".github/workflows/jkt48-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jkt48-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies\n        run: npm install\n\n      - name: Validate JavaScript syntax
        run: |
          node --check website/jkt48/app.js
          node --check src/utils/embeds.js

      - name: Run repository tests
        run: npm test

      - name: Validate required website assets
        run: |
          test -f website/jkt48/index.html
          test -f website/jkt48/style.css
          test -f website/jkt48/app.js
          test -f website/jkt48/README.md

      - name: Validate required UI tokens
        run: |
          grep -q 'id="menuToggle"' website/jkt48/index.html
          grep -q 'class="hamburger"' website/jkt48/index.html
          grep -q -- '--red:#d71920' website/jkt48/style.css
          grep -q 'background:var(--white)' website/jkt48/style.css
          grep -q 'prefers-reduced-motion' website/jkt48/style.css
          grep -q 'setColor(EMBED_RED)' src/utils/embeds.js

  deploy:
    if: github.event_name == "push" || github.event_name == "workflow_dispatch"
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/jkt48

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
