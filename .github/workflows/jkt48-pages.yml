name: JKT48 Website Build

on:
  push:
    branches: [main]
    paths:
      - "website/jkt48/**"
      - "src/utils/embeds.js"
      - "test/jkt48-website.test.js"
      - ".github/workflows/jkt48-pages.yml"
  pull_request:
    paths:
      - "website/jkt48/**"
      - "src/utils/embeds.js"
      - "test/jkt48-website.test.js"
      - ".github/workflows/jkt48-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jkt48-website-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Repository integrity validation
        run: npm run validate

      - name: Validate JavaScript syntax
        run: |
          node --check website/jkt48/app.js
          node --check src/utils/embeds.js
          node --check test/jkt48-website.test.js

      - name: Run repository tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

      - name: Validate required website assets
        run: |
          test -f website/jkt48/index.html
          test -f website/jkt48/style.css
          test -f website/jkt48/app.js
          test -f website/jkt48/README.md

      - name: Validate required UI tokens
        run: |
          grep -q 'id="menuToggle"' website/jkt48/index.html
          grep -q 'class="hamburger"' website/jkt48/index.html
          grep -q -- '--red:#d71920' website/jkt48/style.css
          grep -q 'background:var(--white)' website/jkt48/style.css
          grep -q 'prefers-reduced-motion' website/jkt48/style.css
          grep -q 'setColor(EMBED_RED)' src/utils/embeds.js

      - name: Build static artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R website/jkt48/. _site/
          touch _site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: jkt48-center-website
          path: _site
