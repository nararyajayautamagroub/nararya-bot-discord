name: JKT48 Website Build

on:
  push:
    branches:
      - main
    paths:
      - 'website/jkt48/**'
      - '.github/workflows/jkt48-pages.yml'
  pull_request:
    paths:
      - 'website/jkt48/**'
      - '.github/workflows/jkt48-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jkt48-website-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate website JavaScript
        run: node --check website/jkt48/app.js

      - name: Validate required website assets
        run: |
          test -f website/jkt48/index.html
          test -f website/jkt48/style.css
          test -f website/jkt48/app.js
          test -f website/jkt48/README.md

      - name: Validate required UI tokens
        run: |
          grep -q 'id="menuToggle"' website/jkt48/index.html
          grep -q 'class="hamburger"' website/jkt48/index.html
          grep -q -- '--red:#d71920' website/jkt48/style.css
          grep -q 'background:var(--white)' website/jkt48/style.css

      - name: Build static artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R website/jkt48/. _site/
          touch _site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: jkt48-center-website
          path: _site
