name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: find src test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node --trace-deprecation --input-type=module -e "await import('discord.js'); await import('cheerio'); await import('better-sqlite3')"
      - run: NODE_OPTIONS=--trace-deprecation npm test
